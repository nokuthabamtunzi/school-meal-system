<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Meals 🍽️</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);">
  <div class="container">
    <a class="navbar-brand fw-bold" style="color:#667eea;">🍽️ SchoolMeals Pro</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/scan">📷 Scan</a>
      <a class="nav-link" href="/register">👨‍🎓 Students</a>
      <a class="nav-link" href="/dashboard">📊 Dashboard</a>
      <a class="nav-link" href="/report">📋 Report</a>
      <a class="nav-link" href="/settings">⚙️ Settings</a>
      <a class="nav-link text-danger" href="/logout">Logout</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}
      <div class="alert alert-info glass">{{m}}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
