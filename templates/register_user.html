<!DOCTYPE html>
<html>
<head><title>Add User</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#004080; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.card{background:white; padding:30px; border-radius:15px; width:90%; max-width:400px;}
h2{color:#004080; text-align:center;}
input,select{width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc;}
button{width:95%; padding:12px; background:#28a745; color:white; border:none; border-radius:8px; font-weight:bold;}
a{color:#004080; text-decoration:none;}
</style></head>
<body>
<div class="card"><h2>+ Add New User</h2>
<a href="/scan">← Back</a>
{% with messages = get_flashed_messages() %}{% if messages %}<p style="color:green;">{{ messages[0] }}</p>{% endif %}{% endwith %}
<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" placeholder="Password" required>
<select name="role"><option value="staff">Staff</option><option value="admin">Admin</option></select>
<button type="submit">Create User</button>
</form></div></body></html>
