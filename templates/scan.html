{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="glass p-4 text-center">
      <h2 class="fw-bold mb-3">📷 Meal Scanner</h2>
      <div class="qr-scanner mb-3">
        <video id="video" width="100%" autoplay style="border-radius:15px;"></video>
      </div>
      <select id="meal_type" class="form-select mb-3" style="border-radius:30px;">
        <option value="breakfast">🌅 Breakfast</option>
        <option value="lunch">☀️ Lunch</option>
        <option value="supper">🌙 Supper</option>
      </select>
      <div id="result" class="p-3 rounded-4 mt-3" style="display:none;"></div>
      <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    </div>
  </div>
</div>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
let lastScan="";
function showRes(data){
  const el=document.getElementById('result');
  el.style.display='block';
  document.getElementById('beep').play();
  if(data.status=='success'){
    el.className='status-success p-3 rounded-4'; el.innerHTML=`<h4>✅ ${data.name}</h4><p>Due: ${data.due_date} | ${data.days_left} days left</p>`;
  } else if(data.status=='blocked'){
    el.className='status-blocked p-3 rounded-4'; el.innerHTML=`<h4>🚫 BLOCKED ${data.name}</h4><p>Owes $${data.amount_owed} - Need 50% payment</p><p>Fee $${data.monthly_fee}</p>`;
  } else if(data.status.includes('owing')){
    el.className='status-owing p-3 rounded-4'; el.innerHTML=`<h4>⚠️ ${data.name}</h4><p>Owes $${data.amount_owed} but allowed</p><p>Due: ${data.due_date}</p>`;
  } else if(data.status=='already_marked'){
    el.className='p-3 rounded-4 bg-light'; el.innerHTML=`<h4>Already Scanned ✅</h4><p>${data.name}</p>`;
  } else { el.innerHTML=`<p>${data.status} ${data.name||''}</p>`; }
}
function onScanSuccess(decoded){
  if(decoded==lastScan) return;
  lastScan=decoded; setTimeout(()=>lastScan="",3000);
  let adm=decoded.replace('SCHOOL:','').trim();
  fetch('/mark_attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admission_no:adm,meal_type:document.getElementById('meal_type').value})})
 .then(r=>r.json()).then(showRes);
}
const html5Qr=new Html5Qrcode("video"); Html5Qrcode.getCameras().then(c=>{if(c.length){html5Qr.start(c[0].id,{fps:10,qrbox:250},onScanSuccess);}});
</script>
{% endblock %}
